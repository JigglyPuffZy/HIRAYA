services:
  - type: web
    name: hiraya-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HIRAYA_CORS_ORIGINS
        value: "*"
      - key: HIRAYA_MODEL_DIR
        value: ./models
      - key: HIRAYA_ACTIVE_MODEL
        value: champion
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
